; Wind Buddy firmware for the OceanLabz ESP32-S3 AI Explorer camera board (N16R8, ST7735 1.8").
; Build:  pio run          Flash over USB:  pio run -t upload          Logs:  pio device monitor
; Or flash the merged file from dist/ in the browser (see README.md).

[env:explorer]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
; 16 MB flash (QIO) + 8 MB PSRAM (octal)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
; The board's USB-C is the S3's own USB (USB Serial/JTAG). The screen is on 43/44 (UART0's
; default pins), so logs go over USB (CDC on boot), and USB/JTAG stay up while it runs.
; Logs also go to the server (GET /api/device/{id}/logs).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"0.4.6\"
monitor_speed = 115200
extra_scripts = post:merge_firmware.py
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17
