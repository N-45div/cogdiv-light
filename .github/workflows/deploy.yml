name: Deploy

# Deploys the app to Modal after CI passes on main (or when run by hand from the Actions tab),
# then checks the live URL answers. Needs the repository secrets MODAL_TOKEN_ID and
# MODAL_TOKEN_SECRET; until they are set, it skips. The app's own keys (MODEL_API_KEY,
# BASETEN_API_KEY, FIREWORKS_API_KEY, DEVICE_TOKENS, APP_TOKEN) are copied from repository
# secrets into the Modal secret "wind-buddy" on every deploy. See docs/DEPLOYMENT.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    name: Modal configured?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository secrets (docs/DEPLOYMENT.md)."
          fi

  deploy:
    name: Deploy to Modal
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the website
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install modal==1.6.3

      - name: Copy the app's keys into the Modal secret
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          DEVICE_TOKENS: ${{ secrets.DEVICE_TOKENS }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          CLOCK_MODE: ${{ vars.CLOCK_MODE || 'live' }}
        run: |
          env_file="$RUNNER_TEMP/wind-buddy.env"
          : > "$env_file"
          for name in MODEL_API_KEY BASETEN_API_KEY FIREWORKS_API_KEY DEVICE_TOKENS APP_TOKEN CLOCK_MODE; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> "$env_file"; fi
          done
          echo "Setting: $(cut -d= -f1 "$env_file" | paste -sd ' ')"
          modal secret create wind-buddy --from-dotenv "$env_file" --force > /dev/null
          rm -f "$env_file"

      - name: Deploy
        id: deploy
        run: |
          modal deploy deploy/modal_app.py | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.modal\.run' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then echo "::error::No URL in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the live app answers
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 30); do curl -sf "$URL/api/health" && break; sleep 5; done
          curl -sf --max-time 90 "$URL/api/clock"
          curl -sf --max-time 90 "$URL/api/outlook?hours=6" > /dev/null
          echo "::notice title=Deployed::$URL"
          { echo "### Deployed"; echo; echo "$URL"; echo; echo "API docs: $URL/api/docs"; } >> "$GITHUB_STEP_SUMMARY"
