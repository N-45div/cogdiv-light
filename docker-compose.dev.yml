# Development with hot reload on both sides:
#   docker compose -f docker-compose.dev.yml up
#   React dev server: http://localhost:5173 (forwards /api to the backend)
#   API + docs:       http://localhost:8000/api/docs
services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "pip install -q -r requirements.txt &&
             uvicorn wind_monitor.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      # keep the container's node_modules separate from the host's
      - frontend_node_modules:/app/frontend/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --port 5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
